[workspace]
resolver = "3"
members = [
    "crates/vnekey-core",
    "crates/vnekey-config",
    "crates/vnekey-win",
    "crates/vnekey-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
