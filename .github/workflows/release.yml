name: Release

# Đẩy tag dạng v0.1.0 để tạo bản phát hành kèm vnekey.exe và mã SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p vnekey
      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/vnekey.exe dist/vnekey.exe
          $hash = (Get-FileHash dist/vnekey.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  vnekey.exe" | Out-File -Encoding ascii dist/vnekey.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vnekey.exe
            dist/vnekey.exe.sha256
          generate_release_notes: true
